<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Symbiont Opportunity Scout</title>
<style>:root{color-scheme:dark;--bg:#08110f;--panel:#101c19;--line:#284039;--text:#ecf5f0;--muted:#9fb4ac;--accent:#d6ff73;--warn:#ffcf6e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#16352c 0,transparent 35%),var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,sans-serif}main{max-width:1180px;margin:auto;padding:48px 22px 80px}header{border-bottom:1px solid var(--line);padding-bottom:26px;margin-bottom:26px}.eyebrow{color:var(--accent);letter-spacing:.14em;text-transform:uppercase;font-size:12px}h1{font-size:clamp(34px,6vw,70px);line-height:.98;margin:10px 0 18px;font-weight:650}h2{font-size:20px;margin:0}.muted{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin:26px 0}.stat,.card,.notice{background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:14px;padding:18px}.stat b{display:block;font-size:30px;color:var(--accent)}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}button{background:transparent;color:var(--text);border:1px solid var(--line);padding:8px 13px;border-radius:999px;cursor:pointer}button.active{background:var(--accent);color:#102016;border-color:var(--accent)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}.card h3{margin:8px 0 4px;font-size:20px}.score{font-size:32px;color:var(--accent);float:right}.route{font-size:12px;color:var(--warn)}dl{display:grid;grid-template-columns:110px 1fr;gap:5px 10px;margin:16px 0}dt{color:var(--muted)}dd{margin:0}a{color:var(--accent)}details{border-top:1px solid var(--line);padding-top:12px;margin-top:14px}ul{padding-left:20px}.notice{margin:22px 0;border-color:#6a5930}</style></head>
<body><main><header><p class="eyebrow">AGT-009 · GOAL-2026-009 · Governed internal report</p><h1>Opportunity Scout<br>2026-07-21</h1><p class="muted" id="meta">Loading the canonical run dataset…</p></header><div id="app"></div></main>
<script>
const esc=s=>String(s??"Unknown").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
fetch('./latest.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{document.getElementById('meta').textContent=d.correlationId+' · Evidence completed '+d.evidenceCollectionCompletedAt;const routes=['All','Review — awaiting AGT-002 acceptance','Watchlist','Archived'];const app=document.getElementById('app');app.innerHTML='<div class="notice"><strong>No external action.</strong> '+esc(d.noExternalAction)+'</div><section class="stats">'+Object.entries({Sources:d.counts.sourcesChecked,Candidates:d.counts.candidates,Verified:d.counts.verified,Routed:d.counts.routed,Watchlist:d.counts.watchlisted,Archived:d.counts.archived}).map(([k,v])=>'<div class="stat"><span>'+k+'</span><b>'+v+'</b></div>').join('')+'</section><div class="controls">'+routes.map((r,i)=>'<button data-route="'+esc(r)+'" class="'+(i?'':'active')+'">'+esc(r==='Review — awaiting AGT-002 acceptance'?'AGT-002 review':r)+'</button>').join('')+'</div><section class="grid" id="grid"></section>';const render=route=>{document.getElementById('grid').innerHTML=d.opportunities.filter(o=>route==='All'||o.route===route).map(o=>'<article class="card"><span class="score">'+o.score+'</span><p class="eyebrow">'+esc(o.lane)+' · '+esc(o.solicitationNumber)+'</p><h3>'+esc(o.title)+'</h3><p class="muted">'+esc(o.issuer)+'</p><p class="route">'+esc(o.route)+'</p><dl><dt>Deadline</dt><dd>'+esc(o.deadline)+'</dd><dt>Confidence</dt><dd>'+o.confidence+'</dd><dt>Evidence</dt><dd><a href="'+esc(o.canonicalUrl)+'" target="_blank" rel="noreferrer">Canonical source</a></dd><dt>Hash</dt><dd><code>'+esc(o.evidenceHash.slice(0,16))+'…</code></dd></dl><p>'+esc(o.projectBrief)+'</p><details><summary>Governed brief</summary><p><strong>Scope:</strong> '+esc(o.scope)+'</p><p><strong>Historical/new:</strong> '+esc(o.historicalLabel)+' '+esc(o.newPrerogativeLabels.join('; '))+'</p><p><strong>Risks:</strong> '+esc(o.risks.join('; '))+'</p><p><strong>Missing:</strong> '+esc(o.missingInformation.join('; ')||'None recorded')+'</p><p><strong>Next:</strong> '+esc(o.nextAction)+'</p><p><strong>Starter narrative:</strong> '+esc(o.starterNarrative)+'</p></details></article>').join('')};render('All');document.querySelectorAll('button[data-route]').forEach(b=>b.onclick=()=>{document.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.route)})}).catch(e=>{document.getElementById('app').innerHTML='<div class="notice">Dataset unavailable: '+esc(e.message)+'</div>'});
</script></body></html>
