name: Command Center CI

on:
  pull_request:
    paths:
      - "apps/command-center/**"
      - "supabase/**"
      - ".github/workflows/command-center-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/command-center/**"
      - "supabase/**"

permissions:
  contents: read

concurrency:
  group: command-center-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/command-center
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/command-center/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
